patch:
  "translator/dictionary": rime_ice_custom

  "engine/segmentors/@before 0": affix_segmentor@jp_kana
  "engine/translators/@before 0": lua_translator@jp_kana_translator
  "engine/translators/@before 1": table_translator@hiragana
  "engine/translators/@before 2": table_translator@katakana
  # "engine/translators":
  #   - punct_translator
  #   - script_translator
  #   - lua_translator@*date_translator
