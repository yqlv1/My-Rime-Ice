  #   - lua_translator@*uuid
  #   - lua_translator@jp_kana_translator
  #   - table_translator@custom_phrase
  #   - table_translator@melt_eng
  #   - table_translator@cn_en
  #   - table_translator@radical_lookup
  #   - table_translator@hiragana
  #   - table_translator@katakana
  #   - lua_translator@*unicode
  #   - lua_translator@*number_translator
  #   - lua_translator@*calc_translator
  #   - lua_translator@*force_gc
  hiragana: # H进入平假名模式
    dictionary: ""
    user_dict: jp_dicts/hiragana  
    db_class: stabledb
    enable_completion: false 
    enable_sentence: false   
    initial_quality: 99      
  katakana: # K进入片假名模式
    dictionary: ""
    user_dict: jp_dicts/katakana  
    db_class: stabledb
    enable_completion: false 
    enable_sentence: false   
    initial_quality: 99    
  jp_kana:
    tag: jp_kana
    prefix: "ja"
    tips: "〔日文〕"
  "recognizer/patterns/jp_kana": "^ja[a-z]*$"